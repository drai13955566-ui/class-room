<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پانتومیم شهید سلطانی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
/* پانتومیم شهید سلطانی — طرح «کارناوال» برای کلاس پنجم
   فقط ظاهر؛ منطق (JS) و ساختار HTML دست‌نخورده است. */
@import url("https://fonts.googleapis.com/css2?family=Lalezar&display=swap");
/* فونت «کلمه»: فایل woff2 آن را کنار این صفحه بگذارید، این خط را از حالت توضیح دربیاورید و نام Kalameh را اول --font-body و --font-display بنویسید:
@font-face{font-family:Kalameh;src:url("Kalameh.woff2") format("woff2");font-weight:100 900;font-display:swap} */

:root{
  --ink:#1d1147; --lav:#f1ecff; --grape:#5b2ee6;
  --sun:#ffd23f; --tang:#ff9a2e; --coral:#ff5d73; --mint:#2fe0a0; --sky:#38c9ff;
  --text-main:var(--ink); --text-muted:#5e5496;
  --neon-blue:#2456e8; /* رنگ امتیاز در کارت‌های ساخته‌شده با JS */
  --danger:#d6204a;    /* رنگ خطا در کارت‌های ساخته‌شده با JS */
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-body:'Vazirmatn',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body)}
html{min-height:100%;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100svh; padding:clamp(10px,2.5vw,28px); display:flex; justify-content:center; align-items:center;
  color:var(--ink); font-size:1.05rem; line-height:1.7; overflow-x:hidden; user-select:none;
  background:
    radial-gradient(circle,#ffd23f 0 4px,#0000 5px) 0 0/96px 96px,
    radial-gradient(circle,#ff5d73 0 3px,#0000 4px) 48px 34px/96px 96px,
    radial-gradient(circle,#2fe0a0 0 3px,#0000 4px) 20px 66px/96px 96px,
    radial-gradient(circle,#38c9ff 0 4px,#0000 5px) 74px 10px/96px 96px,
    linear-gradient(160deg,#5b2ee6,#8a3ffc 55%,#c13fe0);
  background-attachment:fixed;
}
input,select{user-select:text}

/* ───── قاب اصلی ───── */
.container,.wrap{
  position:relative; width:min(100%,1120px); padding:clamp(22px,3vw,38px) clamp(16px,3vw,36px) clamp(18px,3vw,34px); text-align:center;
  background:#fdfbff; border:4px solid var(--ink); border-radius:30px; box-shadow:10px 10px 0 var(--ink);
}
.wrap{max-width:880px}
.container::before,.wrap::before{
  content:""; position:absolute; inset:0 0 auto; height:14px; border-radius:25px 25px 0 0;
  background:repeating-linear-gradient(90deg,var(--coral) 0 36px,var(--sun) 36px 72px,var(--mint) 72px 108px,var(--sky) 108px 144px);
}
h1{
  font-family:var(--font-display); font-weight:400; color:var(--grape); margin:8px 0 22px;
  font-size:clamp(2.1rem,5.4vw,3.5rem); line-height:1.3; text-shadow:3px 3px 0 var(--sun),6px 6px 0 var(--ink);
}
h2{
  width:fit-content; margin:0 auto 16px; padding:2px 22px 4px; display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-display); font-weight:400; font-size:clamp(1.3rem,2.6vw,1.8rem); color:var(--ink);
  background:var(--sun); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); transform:rotate(-1deg);
}
.wrap>h2{color:var(--ink)!important}



/* ───── پنل دانش‌آموز: برچسب‌های امتیاز ───── */
.sub{color:var(--text-muted); line-height:1.9; font-weight:600}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:20px; margin:28px 0 22px}
.card{
  --c:var(--coral); padding:18px 14px 20px; text-align:center; background:#fff;
  border:3px solid var(--ink); border-top:14px solid var(--c); border-radius:20px; box-shadow:0 6px 0 var(--ink);
}
.card:nth-child(6n+2){--c:var(--sky)} .card:nth-child(6n+3){--c:var(--mint)} .card:nth-child(6n+4){--c:var(--sun)}
.card:nth-child(6n+5){--c:var(--tang)} .card:nth-child(6n+6){--c:#c77dff}
.card:nth-child(odd){transform:rotate(-1.2deg)} .card:nth-child(even){transform:rotate(1.2deg)}
.name{font-family:var(--font-display); font-size:1.5rem; margin-bottom:6px; overflow-wrap:anywhere}
.score{font-family:var(--font-display); font-size:4rem; line-height:1.1; color:var(--ink); text-shadow:4px 4px 0 var(--c)}
.caption{margin-top:4px; font-size:.95rem; font-weight:700; color:var(--text-muted)}
.status{font-size:.9rem; font-weight:600; color:var(--text-muted)}
.empty{grid-column:1/-1; text-align:center; color:var(--text-muted); font-weight:600}

/* ───── اسکرول‌بار ───── */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#e6ddff; border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--grape); border-radius:10px}

/* ───── واکنش‌گرایی ───── */
@media (max-width:600px){
  body{align-items:flex-start; padding:8px}
  .container,.wrap{padding:24px 12px 16px; border-radius:22px; box-shadow:6px 6px 0 var(--ink)}
  
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important}
}
</style></head><body><main class="wrap">
<h1>🎭 پانتومیم شهید سلطانی</h1><h2 style="text-align:center;color:#c7d2fe">پنل دانش‌آموز</h2>
<p class="sub">در این صفحه فقط نام گروه‌ها و امتیاز آن‌ها نمایش داده می‌شود. امتیازها پس از ذخیره معلم، به‌صورت خودکار در این صفحه به‌روزرسانی می‌شوند.</p>
<div id="scores" class="grid"><p class="empty">در حال دریافت امتیازها...</p></div>
<p id="status" class="status">در انتظار دریافت اطلاعات</p>
</main>
<script>
/* تنظیمات مخزن پروژه پانتومیم شهید سلطانی */
const GITHUB_OWNER = 'drai13955566-ui';
const GITHUB_REPO = 'class-room';
const GITHUB_BRANCH = 'main';
const JSON_PATH = 'data/pantomime.json';
const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${JSON_PATH}`;
async function loadScores(){
 const holder=document.getElementById('scores'), status=document.getElementById('status');
 try{
  if(GITHUB_OWNER.startsWith('YOUR_')||GITHUB_REPO.startsWith('YOUR_')) throw new Error('آدرس مخزن GitHub هنوز تنظیم نشده است.');
  const response=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('فایل اطلاعات در GitHub پیدا نشد یا مخزن عمومی نیست.');
  const data=await response.json(), teams=Array.isArray(data.teams)?data.teams:[], scores=Array.isArray(data.scores)?data.scores:[];
  holder.innerHTML='';
  if(!teams.length){holder.innerHTML='<p class="empty">هنوز گروهی ثبت نشده است.</p>';}
  teams.forEach((team,index)=>{
   const card=document.createElement('article');card.className='card';
   const name=document.createElement('div');name.className='name';name.textContent=team;
   const score=document.createElement('div');score.className='score';score.textContent=String(Number(scores[index])||0);
   const caption=document.createElement('div');caption.className='caption';caption.textContent='امتیاز';
   card.append(name,score,caption);holder.appendChild(card);
  });
  status.textContent='آخرین به‌روزرسانی: '+new Date().toLocaleTimeString('fa-IR');
 }catch(err){holder.innerHTML='<p class="empty"></p>';holder.firstChild.textContent=err.message;status.textContent='اتصال برقرار نشد';}
}
loadScores();setInterval(loadScores,10000);
</script></body></html>
